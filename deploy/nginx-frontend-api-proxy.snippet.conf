# Snippet sugerido para o location /api do frontend Nginx
# (mticket.co.mz + *.mticket.co.mz)
#
# Problema: `proxy_set_header Host $host;` envia o Host do tenant
# (ex.: nova-era.mticket.co.mz) para o Laravel em backend.mticket.co.mz.
# Preferir Host fixo do backend e manter X-Tenant para logs se quiseres.

location /api {
    proxy_pass https://backend.mticket.co.mz;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host backend.mticket.co.mz;
    proxy_set_header X-Tenant $tenant;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# DNS (Hostinger VPS): garantir registo wildcard
#   A     *.mticket.co.mz  -> IP da VPS
#   (além de mticket.co.mz e www.mticket.co.mz)
#
# Certificado: já referenciado como wildcard em
#   /etc/letsencrypt/live/mticket.co.mz/
#
# Slugs reservados (não usáveis por promotores):
#   www, backend, api, admin, app, mail, cdn, static, promotores, p, ...
