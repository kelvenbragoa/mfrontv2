# Previews de partilha (WhatsApp, Facebook, Telegram, ...)
#
# O SPA não serve meta tags a crawlers: eles fazem um GET, leem o HTML cru e
# não executam JavaScript, por isso só veem o index.html vazio. Aqui o Nginx
# do frontend deteta esses crawlers pelo User-Agent e serve-lhes o HTML que o
# Laravel gera em /og/*, já com og:title / og:description / og:image.
#
# Utilizadores normais nunca passam por aqui: continuam a receber o index.html.
#
# ============================================================================
# 1) Contexto http {} — /etc/nginx/nginx.conf ou /etc/nginx/conf.d/mticket-og.conf
# ============================================================================

# Só crawlers de preview social. O Googlebot fica de fora de propósito: ele
# executa JavaScript e servir-lhe HTML diferente seria cloaking.
map $http_user_agent $og_is_social_bot {
    default 0;
    "~*(facebookexternalhit|facebookcatalog|Facebot|WhatsApp|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot|Pinterest|redditbot|SkypeUriPreview|vkShare|Iframely|embedly|Applebot)" 1;
}

# Subdomínio do promotor: liv-beira.mticket.co.mz -> "liv-beira"
map $host $og_subdomain {
    default "";
    "~^(?<sub>[a-z0-9][a-z0-9-]*)\.mticket\.co\.mz$" $sub;
}

# Subdomínios reservados não são promotores.
map $og_subdomain $og_promotor {
    default        $og_subdomain;
    ""             "";
    "www"          "";
    "api"          "";
    "backend"      "";
    "admin"        "";
    "app"          "";
    "mail"         "";
    "cdn"          "";
    "static"       "";
    "promotores"   "";
    "p"            "";
    "ftp"          "";
    "webmail"      "";
    "cpanel"       "";
}

# Raiz de um subdomínio de promotor pedida por um bot -> slug do promotor.
map "$og_is_social_bot:$og_promotor" $og_home_promotor {
    default "";
    "~^1:(?<slug>.+)$" $slug;
}

# ============================================================================
# 2) Dentro do server {} de mticket.co.mz / *.mticket.co.mz
# ============================================================================

# Página do evento: /eventos/puto-portugues-em-concerto
location ~ ^/eventos/(?<og_event_slug>[A-Za-z0-9._-]+)/?$ {
    if ($og_is_social_bot) {
        rewrite ^ /__og/eventos/$og_event_slug last;
    }

    try_files $uri /index.html;
}

# Página do promotor no domínio principal: /p/liv-beira
location ~ ^/p/(?<og_promotor_slug>[A-Za-z0-9._-]+)/?$ {
    if ($og_is_social_bot) {
        rewrite ^ /__og/p/$og_promotor_slug last;
    }

    try_files $uri /index.html;
}

# Página do promotor em subdomínio: https://liv-beira.mticket.co.mz/
location = / {
    if ($og_home_promotor) {
        rewrite ^ /__og/p/$og_home_promotor last;
    }

    try_files /index.html =404;
}

# Só acessível por rewrite interno — nunca directamente da internet.
location /__og/ {
    internal;

    proxy_pass https://backend.mticket.co.mz/og/;
    proxy_ssl_server_name on;

    proxy_set_header Host backend.mticket.co.mz;
    proxy_set_header X-Og-Host $host;          # o Laravel usa isto no og:url
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 15s;
}

# ============================================================================
# 3) Aplicar e testar
# ============================================================================
#
#   nginx -t && systemctl reload nginx
#
# Como bot (deve devolver HTML com as meta tags):
#   curl -s -A "WhatsApp/2.23" https://liv-beira.mticket.co.mz/eventos/puto-portugues-em-concerto | grep 'og:'
#
# Como utilizador normal (deve devolver o index.html do SPA):
#   curl -s https://liv-beira.mticket.co.mz/eventos/puto-portugues-em-concerto | head -20
#
# Depois de confirmar, forçar o Facebook/WhatsApp a reler o link (a cache deles
# guarda o preview antigo durante dias):
#   https://developers.facebook.com/tools/debug/  ->  "Scrape Again"
