# Previews de partilha — parte 2 de 2: rotas (contexto server {})
#
# Guardar como /etc/nginx/snippets/mticket-og-locations.conf e incluir dentro
# do server{} 443 de mticket.co.mz, ANTES do `location ~* \.(js|css|...)$`:
#
#     include /etc/nginx/snippets/mticket-og-locations.conf;
#
# Requer as variáveis do nginx-og-maps.conf e a captura $tenant do server_name.
#
# Os slugs aqui não aceitam ponto de propósito: assim /eventos/algo.png nunca
# rouba o location dos ficheiros estáticos.

# Página do evento: /eventos/puto-portugues-em-concerto
location ~ ^/eventos/(?<og_event_slug>[A-Za-z0-9_-]+)/?$ {
    if ($og_is_social_bot) {
        rewrite ^ /__og/eventos/$og_event_slug last;
    }

    try_files $uri /index.html;

    add_header X-Tenant $tenant always;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
}

# Página do promotor no domínio principal: /p/liv-beira
location ~ ^/p/(?<og_promotor_slug>[A-Za-z0-9_-]+)/?$ {
    if ($og_is_social_bot) {
        rewrite ^ /__og/p/$og_promotor_slug last;
    }

    try_files $uri /index.html;

    add_header X-Tenant $tenant always;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
}

# Página do promotor em subdomínio: https://liv-beira.mticket.co.mz/
# Repete os headers do `location /` porque um location exacto não os herda.
location = / {
    if ($og_home_promotor) {
        rewrite ^ /__og/p/$og_home_promotor last;
    }

    try_files /index.html =404;

    add_header X-Tenant $tenant always;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
}

# Só acessível por rewrite interno — nunca directamente da internet.
location /__og/ {
    internal;

    proxy_pass https://backend.mticket.co.mz/og/;
    proxy_ssl_server_name on;

    proxy_set_header Host backend.mticket.co.mz;
    proxy_set_header X-Og-Host $host;          # o Laravel usa isto no og:url
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 15s;
}
